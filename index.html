<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Performance | Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div id="app">
        <!-- Loader -->
        <div id="loader"
            class="fixed inset-0 z-50 flex items-center justify-center bg-white transition-opacity duration-1000"
            style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 50;">
            <span class="text-small tracking-wide opacity-50 animate-pulse">Loading...</span>
        </div>

        <!-- Main Content -->
        <main id="main-content" style="opacity: 0;" class="transition-opacity duration-1000"></main>

        <!-- Sticky Contact CTA -->
        <footer id="sticky-cta"
            class="fixed bottom-0 left-0 right-0 z-40 transform translate-y-full transition-transform duration-500"
            style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; transform: translateY(100%);"></footer>
    </div>
    <script type="module" src="/main.js"></script>
</body>

</html>
